services:
  ml-service:
    build:
      context: ../Portfolio-ML-Service
      dockerfile: Dockerfile
    container_name: portfolio-ml-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
    networks:
      - portfolio-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
      NODE_ENV: production
      PYTHON_ML_SERVICE_URL: http://ml-service:5000
      DATABASE: ${DATABASE}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-thisismyportfolioandonlyIhavetheaccesstomakechangestoit}
      JWT_EXPIRES_IN: 90d
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      - ml-service
    networks:
      - portfolio-network

  frontend:
    build:
      context: ../ashishbiswasportfolio
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
      - ml-service
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
